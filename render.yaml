services:
  - type: web
    name: garena-bind-tool
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Optional — override defaults
      # - key: ADMIN_USERNAME
      #   value: "1"
      # - key: ADMIN_PASSWORD
      #   value: "1"
      # - key: SECRET_KEY
      #   value: "your-very-long-random-secret"